<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Tebak Angka</title><link rel="stylesheet" href="/admin.css"></head><body><main><h1>⚙️ Admin Tebak Angka</h1><section id="auth" class="card"><input id="password" type="password" placeholder="Password admin"><button id="login">Masuk</button><p id="loginMsg"></p></section><section id="panel" class="hide"><div class="stats"><div class="card">Pemain <b id="players">0</b></div><div class="card">Skor <b id="scores">0</b></div><div class="card">Tertinggi <b id="top">0</b></div></div><div class="card"><h2>Pengaturan</h2><label>Judul<input id="game_title"></label><h3>Easy</h3><div class="grid"><input id="easy_max" type="number" placeholder="Max"><input id="easy_lives" type="number" placeholder="Lives"><input id="easy_time" type="number" placeholder="Detik"><input id="easy_multiplier" type="number" step="0.1" placeholder="Multiplier"></div><h3>Medium</h3><div class="grid"><input id="medium_max" type="number"><input id="medium_lives" type="number"><input id="medium_time" type="number"><input id="medium_multiplier" type="number" step="0.1"></div><h3>Hard</h3><div class="grid"><input id="hard_max" type="number"><input id="hard_lives" type="number"><input id="hard_time" type="number"><input id="hard_multiplier" type="number" step="0.1"></div><button id="save">Simpan</button></div><div class="card"><h2>Leaderboard</h2><button id="clear">Hapus Semua</button><div class="tablewrap"><table><thead><tr><th>ID</th><th>Nama</th><th>Skor</th><th>Level</th><th>Attempts</th><th></th></tr></thead><tbody id="table"></tbody></table></div></div></section></main><script src="/admin.js"></script></body></html>
