<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎯 TEBAK ANGKA</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap">
<header><h1>🎯 TEBAK ANGKA</h1><p>Game tebak angka online</p></header>
<section id="auth" class="card"><div class="tabs"><button id="tabLogin" class="active">Login</button><button id="tabReg">Daftar</button></div><input id="name" placeholder="Nama pemain"><input id="pass" type="password" placeholder="Password (min. 6 karakter)"><button id="authBtn">Masuk</button><p id="authMsg" class="msg"></p></section>
<section id="setup" class="card hide"><div class="userbar">👤 <b id="pname"></b> · Level <b id="level">1</b> · 🪙 <b id="coins">0</b> <button id="logout" class="small">Keluar</button></div><label>Kesulitan<select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><button id="start">Mulai Game</button><p class="hint">Server yang menentukan angka rahasia dan skor.</p></section>
<section id="game" class="card hide"><div class="stats"><span>❤️ <b id="lives">—</b></span><span>⏱️ <b id="timer">—</b></span><span>⭐ <b id="score">0</b></span></div><p>Tebak angka <b id="range">1–100</b></p><div class="guessrow"><input id="input" type="number" inputmode="numeric" placeholder="Masukkan angka"><button id="guess">Tebak</button></div><p id="msg" class="msg"></p><div id="history"></div><button id="new" class="secondary">Game Baru</button></section>
<section class="card"><h2>🏆 Leaderboard</h2><div id="board">Memuat...</div></section>
</main><script src="/app.js"></script></body></html>
